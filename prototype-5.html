<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOT YET — Prototype</title>
<style>
:root{--bg:#f6efe6;--ink:#172327;--accent:#e9b29f;--soft:#e6eee4;--line:#d9d0c5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 20px 34px;background:linear-gradient(#fffaf5,#f7efe5)}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font:22px Georgia,serif}.lang button{width:auto;padding:7px 9px;margin-left:4px}.lang button.on{background:#172a2f;color:white}
h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:44px;line-height:1.02}h2{font-size:30px}p{line-height:1.45}.muted{opacity:.68}.small{font-size:13px}
.progress{height:5px;background:#ddd4ca;border-radius:9px;margin:25px 0 30px}.progress i{display:block;height:100%;background:#1c3035;border-radius:9px}
button,.choice{width:100%;border:1px solid var(--line);background:#fffaf5;border-radius:13px;padding:14px 15px;margin:6px 0;text-align:left;font-size:15px;color:var(--ink);cursor:pointer}
button.primary{background:#172a2f;color:white;text-align:center;border:none;margin-top:18px}.choice.sel,.row button.sel{background:#f5c8b7;border-color:#f5c8b7}
textarea{width:100%;min-height:135px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fffdf9;font:15px Arial}.note{padding:16px;border-radius:15px;background:var(--soft);margin:18px 0}.peach{background:#fae4da}.screen{display:none}.screen.active{display:block}.hero{padding-top:35px}.center{text-align:center}.timer{font:42px Georgia,serif;text-align:center;margin:28px}.row{display:flex;gap:8px}.row button{flex:1;text-align:center}.result{border-left:3px solid #799071;padding-left:14px;margin:14px 0}
</style></head><body><main class="app">
<div class="top"><div class="brand">Not Yet.</div><div class="lang"><button id="enBtn" onclick="setLang('en')">EN</button><button id="roBtn" onclick="setLang('ro')">RO</button></div></div>
<section class="screen active" id="s0"><div class="hero"><h1 data-k="startTitle"></h1><p data-k="startCopy"></p><p><b data-k="notYet"></b></p><button class="primary" onclick="go(1)" data-k="start"></button><p class="small center muted" data-k="threeMin"></p></div></section>
<section class="screen" id="s1"><div class="progress"><i style="width:12%"></i></div><h2 data-k="whatHappened"></h2><p class="muted" data-k="closest"></p><div id="events"></div><button class="primary" onclick="go(2)" data-k="continue"></button></section>
<section class="screen" id="s2"><div class="progress"><i style="width:25%"></i></div><h2 data-k="showedUp"></h2><p data-k="oneMore"></p><div id="feelings"></div><div class="note peach"><b data-k="uncomfortable"></b><br><span data-k="butMaybe"></span></div><button class="primary" onclick="go(3)" data-k="continue"></button></section>
<section class="screen" id="s3"><div class="progress"><i style="width:38%"></i></div><h2 data-k="factsTitle"></h2><p data-k="camera"></p><p class="small muted" data-k="noMotives"></p><textarea id="facts"></textarea><button class="primary" onclick="go(4)" data-k="continue"></button></section>
<section class="screen" id="s4"><div class="progress"><i style="width:50%"></i></div><h2 data-k="storyTitle"></h2><p data-k="storyQ"></p><div id="stories"></div><textarea id="storyOther"></textarea><div class="note peach"><b data-k="difference"></b><br><br><b>FACT:</b> <span data-k="factDef"></span><br><b>STORY:</b> <span data-k="storyDef"></span></div><button class="primary" onclick="go(5)" data-k="keepGoing"></button></section>
<section class="screen" id="s5"><div class="progress"><i style="width:62%"></i></div><h2 data-k="yourPart"></h2><div id="responsibilityQs"></div><button class="primary" onclick="responsibility()" data-k="continue"></button></section>
<section class="screen" id="s6a"><h2 data-k="repairTitle"></h2><div class="note"><p data-k="repairKeep"></p></div><p data-k="accountability"></p><p class="muted" data-k="repairExample"></p><button class="primary" onclick="go(7)" data-k="whatNow"></button></section>
<section class="screen" id="s6b"><h2 data-k="knowTitle"></h2><div class="result" data-k="noClear"></div><div class="note"><b data-k="disappointed"></b></div><p class="muted" data-k="differentAnswers"></p><button class="primary" onclick="go(7)" data-k="continue"></button></section>
<section class="screen" id="s7"><div class="progress"><i style="width:75%"></i></div><h2 data-k="urgeTitle"></h2><div id="urges"></div><button class="primary" onclick="go(8)" data-k="continue"></button></section>
<section class="screen" id="s8"><div class="center"><h1>NOT YET.</h1><p data-k="stillCan"></p><p data-k="phone"></p><div class="timer" id="timer">30:00</div><button class="primary" onclick="startTimer()" data-k="startPause"></button><button onclick="go(9)" data-k="writeDontSend"></button><p class="small muted" data-k="choiceLater"></p></div></section>
<section class="screen" id="s9"><h2 data-k="getOut"></h2><p data-k="writeHere"></p><textarea id="unsent"></textarea><p><b data-k="hopeMessage"></b></p><div id="needs"></div><div class="note peach" data-k="communicate"></div><button class="primary" onclick="go(10)" data-k="checkAgain"></button></section>
<section class="screen" id="s10"><h2 data-k="feelNow"></h2><div id="finishChoices"></div></section>
<section class="screen" id="s11"><div class="hero center"><h1 id="endTitle"></h1><p id="endCopy"></p><button class="primary" onclick="resetApp()" data-k="done"></button><p class="small muted" data-k="comeBack"></p></div></section>
</main><script>
const T={
en:{startTitle:"Something happened.",startCopy:"And now you're replaying it, questioning yourself or feeling the urge to fix it.",notYet:"You don't have to do anything yet.",start:"Start here →",threeMin:"About 3 minutes",whatHappened:"What happened?",closest:"Pick the closest one. It doesn't have to be perfect.",continue:"Continue →",showedUp:"What showed up?",oneMore:"Select one or more.",uncomfortable:"Feeling uncomfortable doesn't automatically mean you did something wrong.",butMaybe:"But it doesn't automatically mean you didn't. Let's look at what actually happened.",factsTitle:"Just the facts.",camera:"Imagine a camera was in the room. What would it have recorded?",noMotives:"No motives. No interpretations. Just what happened.",factsPH:"Example: My sister asked me to watch her kids Saturday and I told her I couldn't.",storyTitle:"Now the story.",storyQ:"What are you afraid this means about you or the relationship?",storyPH:"Or write your own story…",difference:"Notice the difference.",factDef:"what happened.",storyDef:"what you're afraid it means.",keepGoing:"Keep going →",yourPart:"Let's check your part.",repairTitle:"Maybe there's something worth repairing.",repairKeep:"You can keep your boundary and take responsibility for how you expressed it.",accountability:"Accountability doesn't require self-abandonment.",repairExample:"Try separating the decision from the behaviour: “I still mean what I said. I don't like how I said it, and I'm sorry for that.”",whatNow:"What do I want to do now? →",knowTitle:"Here's what we know.",noClear:"You haven't identified a clear broken agreement, deliberate harm, manipulation, or behaviour against your own values.",disappointed:"Someone being disappointed doesn't automatically mean you've done something wrong.",differentAnswers:"If your answers were different, we'd be looking at repair instead of reassurance. Both are okay.",urgeTitle:"What do you want to do right now?",stillCan:"You can still do it.",phone:"We're just not going to decide while the feeling is holding the phone.",startPause:"Start 30-minute pause",writeDontSend:"Write it, don't send it →",choiceLater:"Nothing is being taken away from you. You can still choose later.",getOut:"Need to get it out?",writeHere:"Write the message here instead. You can keep it, edit it or delete it.",unsentPH:"Write the message you want to send…",hopeMessage:"What are you hoping this message will give you?",communicate:"Maybe you need to communicate. Maybe you're trying to make the uncomfortable feeling disappear. <b>Those aren't always the same problem.</b>",checkAgain:"I'm ready to check again →",feelNow:"How does it feel now?",done:"Done",comeBack:"Come back if it gets loud again.",yes:"Yes",no:"No"},
ro:{startTitle:"S-a întâmplat ceva.",startCopy:"Iar acum derulezi momentul în minte, te îndoiești de tine sau simți nevoia să repari imediat.",notYet:"Nu trebuie să faci nimic încă.",start:"Începe aici →",threeMin:"Aproximativ 3 minute",whatHappened:"Ce s-a întâmplat?",closest:"Alege varianta cea mai apropiată. Nu trebuie să fie perfectă.",continue:"Continuă →",showedUp:"Ce ai simțit?",oneMore:"Alege una sau mai multe variante.",uncomfortable:"Faptul că te simți inconfortabil nu înseamnă automat că ai făcut ceva greșit.",butMaybe:"Dar nici nu înseamnă automat că n-ai greșit. Hai să vedem ce s-a întâmplat de fapt.",factsTitle:"Doar faptele.",camera:"Imaginează-ți că era o cameră în încăpere. Ce ar fi înregistrat?",noMotives:"Fără presupuneri despre intenții. Fără interpretări. Doar ce s-a întâmplat.",factsPH:"Exemplu: Sora mea m-a rugat să stau cu copiii sâmbătă și i-am spus că nu pot.",storyTitle:"Acum, povestea.",storyQ:"De ce ți-e teamă că spune asta despre tine sau despre relația voastră?",storyPH:"Sau scrie propria ta poveste…",difference:"Observă diferența.",factDef:"ce s-a întâmplat.",storyDef:"ce ți-e teamă că înseamnă.",keepGoing:"Mergem mai departe →",yourPart:"Hai să verificăm partea ta.",repairTitle:"Poate există ceva ce merită reparat.",repairKeep:"Poți să-ți păstrezi limita și, în același timp, să-ți asumi felul în care ai exprimat-o.",accountability:"Să-ți asumi responsabilitatea nu înseamnă să te abandonezi pe tine.",repairExample:"Separă decizia de felul în care ai transmis-o: „Rămân la ceea ce am spus. Dar nu-mi place cum ți-am vorbit și îmi pare rău pentru asta.”",whatNow:"Ce vreau să fac acum? →",knowTitle:"Iată ce știm.",noClear:"Nu ai identificat un acord încălcat clar, rău făcut intenționat, manipulare sau un comportament împotriva propriilor tale valori.",disappointed:"Faptul că cineva este dezamăgit nu înseamnă automat că ai făcut ceva greșit.",differentAnswers:"Dacă răspunsurile tale ar fi fost diferite, ne-am uita la reparare, nu la reasigurare. Ambele sunt în regulă.",urgeTitle:"Ce simți nevoia să faci chiar acum?",stillCan:"Poți face asta și mai târziu.",phone:"Doar nu vom decide cât timp emoția ține telefonul în mână.",startPause:"Începe pauza de 30 de minute",writeDontSend:"Scrie-l, dar nu-l trimite →",choiceLater:"Nu ți se ia nicio opțiune. Poți decide mai târziu.",getOut:"Ai nevoie să scoți mesajul din tine?",writeHere:"Scrie-l aici. Îl poți păstra, modifica sau șterge.",unsentPH:"Scrie mesajul pe care ai vrea să-l trimiți…",hopeMessage:"Ce speri să-ți ofere acest mesaj?",communicate:"Poate chiar ai ceva de comunicat. Sau poate încerci doar să faci disconfortul să dispară. <b>Nu sunt întotdeauna aceeași problemă.</b>",checkAgain:"Sunt gata să verific din nou →",feelNow:"Cum se simte acum?",done:"Gata",comeBack:"Revino dacă începe din nou să fie zgomotos.",yes:"Da",no:"Nu"}};
const O={
en:{events:["I said no","I set a boundary","I think I upset someone","I think I overshared","I had a difficult conversation","I stood up for myself","I made a mistake","I want to send another message","I can't stop replaying what happened","Something else"],feelings:["Guilt","Anxiety","Shame","Fear","Regret","Sadness","Anger","Confusion"],stories:["I'm selfish","I'm a bad friend / partner / family member","I've disappointed them","They're angry with me","They'll think I don't care","I've ruined things","I should have stayed quiet"],urges:["Apologize","Explain myself","Send another message","Change my answer","Ask if they're angry","Call them","Check their social media","Nothing — I just can't stop thinking about it"],needs:["Reassurance","Forgiveness","Proof they're not angry","To be understood","To change their reaction","To clarify something important","To repair something I actually did","I'm not sure"],qs:["Did you deliberately insult, threaten or try to hurt them?","Did you break a promise or agreement?","Did you lie or manipulate the situation?","Did the way you handled it go against your own values?"],finish:["I still want to respond.","The urge has passed.","I'm still unsure."]},
ro:{events:["Am spus nu","Am pus o limită","Cred că am supărat pe cineva","Cred că am spus prea mult","Am avut o conversație dificilă","Mi-am susținut punctul de vedere","Am făcut o greșeală","Vreau să mai trimit un mesaj","Nu mă pot opri din a relua ce s-a întâmplat","Altceva"],feelings:["Vinovăție","Anxietate","Rușine","Teamă","Regret","Tristețe","Furie","Confuzie"],stories:["Sunt egoist(ă)","Sunt un prieten / partener / membru al familiei rău","I-am dezamăgit","Sunt supărați pe mine","Vor crede că nu-mi pasă","Am stricat totul","Ar fi trebuit să tac"],urges:["Să-mi cer scuze","Să mă explic","Să mai trimit un mesaj","Să-mi schimb răspunsul","Să întreb dacă sunt supărați","Să sun","Să le verific rețelele sociale","Nimic — doar nu mă pot opri din a mă gândi"],needs:["Reasigurare","Iertare","Dovada că nu sunt supărați","Să fiu înțeles / înțeleasă","Să le schimb reacția","Să clarific ceva important","Să repar ceva ce chiar am făcut","Nu sunt sigur(ă)"],qs:["Ai insultat, amenințat sau încercat intenționat să rănești persoana?","Ai încălcat o promisiune sau o înțelegere?","Ai mințit sau ai manipulat situația?","Felul în care ai gestionat situația a fost împotriva propriilor tale valori?"],finish:["Încă vreau să răspund.","Impulsul a trecut.","Încă nu sunt sigur(ă)."]}};
let lang=localStorage.getItem('nyLang')||((navigator.language||'').toLowerCase().startsWith('ro')?'ro':'en'), harm=0, intv;
function setLang(l){lang=l;localStorage.setItem('nyLang',l);document.documentElement.lang=l;document.querySelectorAll('[data-k]').forEach(e=>e.innerHTML=T[l][e.dataset.k]);enBtn.classList.toggle('on',l==='en');roBtn.classList.toggle('on',l==='ro');facts.placeholder=T[l].factsPH;storyOther.placeholder=T[l].storyPH;unsent.placeholder=T[l].unsentPH;render()}
function renderChoices(id,arr,multi=false){document.getElementById(id).innerHTML=arr.map(x=>`<button class="choice" onclick="selectChoice(this,${multi})">${x}</button>`).join('')}
function render(){renderChoices("events",O[lang].events);renderChoices("feelings",O[lang].feelings,true);renderChoices("stories",O[lang].stories);renderChoices("urges",O[lang].urges);renderChoices("needs",O[lang].needs);responsibilityQs.innerHTML=O[lang].qs.map(q=>`<div><p>${q}</p><div class="row"><button onclick="flag(true,this)">${T[lang].yes}</button><button onclick="flag(false,this)">${T[lang].no}</button></div></div>`).join('');finishChoices.innerHTML=O[lang].finish.map((x,i)=>`<button onclick="finish('${['respond','passed','unsure'][i]}')">${x}</button>`).join('')}
function selectChoice(el,multi){if(!multi)[...el.parentElement.children].forEach(x=>x.classList.remove("sel"));el.classList.toggle("sel")}
function go(n){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById("s"+n).classList.add("active");window.scrollTo(0,0)}
function flag(v,el){let row=el.parentElement;if(!row.dataset.answered){if(v)harm++;row.dataset.answered=v?'yes':'no'}else{if(row.dataset.answered==='yes'&&!v)harm--;if(row.dataset.answered==='no'&&v)harm++;row.dataset.answered=v?'yes':'no'}[...row.children].forEach(x=>x.classList.remove("sel"));el.classList.add("sel")}
function responsibility(){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(harm>0?"s6a":"s6b").classList.add("active");window.scrollTo(0,0)}
function startTimer(){let t=30*60;clearInterval(intv);intv=setInterval(()=>{t--;timer.textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");if(t<=0){clearInterval(intv);go(10)}},1000)}
function finish(type){const E=lang==='ro'?{respond:["Răspunde pentru că alegi — nu pentru că ai intrat în panică.","Poți clarifica, repara, repeta limita sau poți mai aștepta."],passed:["Nu a trebuit să reacționezi imediat.","Impulsul a trecut. Asta este o informație utilă."],unsure:["Nu trebuie să știi încă.","Incertitudinea nu este o urgență. Mai dă-i timp."]}:{respond:["Respond because you choose to — not because you panicked.","You can clarify, repair, repeat the boundary, or wait longer."],passed:["You didn't have to react immediately.","The urge passed. That's useful information."],unsure:["You don't have to know yet.","Uncertainty isn't an emergency. Give it more time."]};endTitle.textContent=E[type][0];endCopy.textContent=E[type][1];go(11)}
function resetApp(){harm=0;clearInterval(intv);document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));document.querySelectorAll("[data-answered]").forEach(x=>delete x.dataset.answered);timer.textContent="30:00";go(0)}
setLang(lang);
</script></body></html>
